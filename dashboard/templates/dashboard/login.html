<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navabharath - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">Navabharath Login</h2>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div class="flex flex-col space-y-1">
                    <label class="text-sm font-semibold text-gray-600">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-slate-900 text-white py-2.5 rounded-lg hover:bg-slate-800 transition">
                Sign In
            </button>
        </form>
    </div>
    <script>
        document.querySelectorAll('input').forEach(el => {
            if(el.type !== 'submit' && el.type !== 'hidden') {
                el.classList.add('w-full', 'px-4', 'py-2', 'border', 'border-gray-300', 'rounded-lg', 'outline-none', 'focus:ring-2', 'focus:ring-slate-500');
            }
        });
    </script>
</body>
</html>
