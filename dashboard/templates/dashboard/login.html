<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navabharath - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-xs font-black tracking-widest text-slate-400 uppercase mb-2">Platform Portal</h1>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">NAVABHARATH LOGIN</h2>
        </div>
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
                <div class="flex flex-col space-y-1.5">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
            <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold hover:bg-slate-800 transition tracking-wide shadow-lg mt-2 text-sm">
                Sign In to Dashboard
            </button>
        </form>
    </div>
    <script>
        document.querySelectorAll('input').forEach(el => {
            if(el.type !== 'submit' && el.type !== 'hidden') {
                el.classList.add('w-full', 'px-4', 'py-2.5', 'border', 'border-slate-200', 'rounded-xl', 'outline-none', 'focus:ring-2', 'focus:ring-slate-950', 'bg-slate-50', 'text-sm', 'transition');
            }
        });
    </script>
</body>
</html>
